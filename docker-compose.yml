###############################################################################
# Pegasus Extract — Docker Compose
#
# Usage:
#   cp backend/.env.example backend/.env   # fill in your API keys
#   docker compose up --build
#
# Services:
#   backend  — FastAPI + Playwright + Chromium  (port 8001)
#   frontend — Next.js                          (port 3000)
###############################################################################

version: "3.9"

services:
  # ── Backend: Python + Playwright + Chromium ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pegasus-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      - PORT=8001
      - BACKEND_PORT=8001
      - FRONTEND_URL=http://localhost:3000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      # Persist extraction output across restarts
      - pegasus-output:/app/output
    # Chromium needs shared memory for rendering
    shm_size: "2gb"
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3

  # ── Frontend: Next.js ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the client JS bundle at build time
        NEXT_PUBLIC_API_URL: http://localhost:8001
    container_name: pegasus-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pegasus-output:
    driver: local
