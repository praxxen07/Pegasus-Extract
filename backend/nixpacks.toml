# Railway / Nixpacks build configuration for Pegasus Extract backend
# Installs system dependencies required by Playwright Chromium

[phases.setup]
nixPkgs = [
  "python311",
  "gcc",
  "libuuid",
  "which",
  "curl",
]

# Playwright Chromium requires these system libraries on Debian/Ubuntu
aptPkgs = [
  "libnss3",
  "libnspr4",
  "libatk1.0-0",
  "libatk-bridge2.0-0",
  "libcups2",
  "libdrm2",
  "libdbus-1-3",
  "libxkbcommon0",
  "libatspi2.0-0",
  "libxcomposite1",
  "libxdamage1",
  "libxfixes3",
  "libxrandr2",
  "libgbm1",
  "libpango-1.0-0",
  "libcairo2",
  "libasound2",
  "libwayland-client0",
  "fonts-noto-color-emoji",
  "fonts-liberation",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium --with-deps",
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8001}"
